name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Build
      run: dotnet build SolTechnology.Time.slnx -c Release
    - name: Test
      run: dotnet test tests/SolTechnology.Time.UnitTests -c Release --no-build
      # One leg with a local zone that has DST, so FromDateTime(Kind.Local) is tested in an ambiguous hour.
      env:
        TZ: ${{ matrix.os == 'ubuntu-latest' && 'Europe/Warsaw' || '' }}

  invariant-globalization:
    name: Test (invariant globalization)
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - run: dotnet test tests/SolTechnology.Time.UnitTests -c Release -f net10.0

  no-tzdata:
    name: Test (no time zone database)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - run: dotnet build tests/SolTechnology.Time.UnitTests -c Release -f net10.0
    - name: Test with TZDIR pointing to an empty directory
      run: |
        mkdir -p /tmp/empty-zoneinfo
        dotnet test tests/SolTechnology.Time.UnitTests -c Release -f net10.0 --no-build --filter "FullyQualifiedName~NoTimeZoneDatabase|FullyQualifiedName~ZonesTests.Utc|FullyQualifiedName~ZonesTests.FixedOffset"
      env:
        TZDIR: /tmp/empty-zoneinfo
        EXPECT_NO_TZDATA: "1"

  nodatime-oracle:
    name: Compare with NodaTime (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - run: dotnet test tests/SolTechnology.Time.OracleTests -c Release
